name: Arduino library CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Code quality and command tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install pre-commit==4.7.0
      - run: pre-commit run --all-files

  library-manager:
    name: Arduino Library Manager validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/arduino-lint-action@v3.0.0
        with:
          path: ${{ github.workspace }}
          version: '1.3.0'
          project-type: library
          compliance: strict
          library-manager: submit

  examples:
    name: ${{ matrix.sketch }} on ${{ matrix.board }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sketch: HelloVFD
            board: Nano Every
            fqbn: arduino:megaavr:nona4809:mode=off
          - sketch: BitmapVFD
            board: Nano Every
            fqbn: arduino:megaavr:nona4809:mode=off
          - sketch: HelloVFD
            board: Uno WiFi Rev2
            fqbn: arduino:megaavr:uno2018
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/setup-arduino-cli@v2.1.0
      - run: arduino-cli core install arduino:megaavr@1.8.8
      - run: arduino-cli compile --fqbn "${{ matrix.fqbn }}" --library . "examples/${{ matrix.sketch }}"
