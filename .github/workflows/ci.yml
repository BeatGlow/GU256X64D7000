name: Arduino library CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Code quality and command tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install pre-commit==4.7.0
      - run: pre-commit run --all-files

  library-manager:
    name: Arduino Library Manager validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/arduino-lint-action@v3.0.0
        with:
          path: ${{ github.workspace }}
          version: '1.3.0'
          project-type: library
          compliance: strict
          library-manager: submit

  examples:
    needs: [quality, library-manager]
    name: ${{ matrix.sketch }} on ${{ matrix.board.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sketch: [HelloVFD, BitmapVFD]
        board:
          - name: Nano Every
            fqbn: arduino:megaavr:nona4809:mode=off
            core: arduino:megaavr@1.8.8
          - name: Uno WiFi Rev2
            fqbn: arduino:megaavr:uno2018
            core: arduino:megaavr@1.8.8
          - name: Uno R3
            fqbn: arduino:avr:uno
            core: arduino:avr@1.8.8
          - name: Mega 2560
            fqbn: arduino:avr:mega:cpu=atmega2560
            core: arduino:avr@1.8.8
          - name: Pro Micro 5 V
            fqbn: SparkFun:avr:promicro:cpu=16MHzatmega32U4
            core: SparkFun:avr@1.1.13
          - name: Uno R4 Minima
            fqbn: arduino:renesas_uno:minima
            core: arduino:renesas_uno@1.5.3
    env:
      SPARKFUN_INDEX: https://raw.githubusercontent.com/sparkfun/Arduino_Boards/main/IDE_Board_Manager/package_sparkfun_index.json
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/setup-arduino-cli@v2.1.0
      - if: matrix.board.core == 'SparkFun:avr@1.1.13'
        run: arduino-cli core install arduino:avr@1.8.8
      - run: arduino-cli core install "${{ matrix.board.core }}" --additional-urls "$SPARKFUN_INDEX"
      - run: arduino-cli compile --fqbn "${{ matrix.board.fqbn }}" --library . "examples/${{ matrix.sketch }}"

  emulator-tests:
    name: Emulator tests
    needs: examples
    uses: ./.github/workflows/emulator.yml

  platformio-packages:
    name: PlatformIO packages
    needs: examples
    uses: ./.github/workflows/platformio.yml
